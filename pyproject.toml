[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "orbital-ai"
version = "0.1.0"
description = "Local-first orbital intelligence and conjunction assessment platform"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "httpx",
    "numpy",
    "pandas",
    "pydantic",
    "scipy",
    "sgp4",
    "skyfield",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

platform = [
    "fastapi==0.141.1",
    "sqlalchemy==2.0.52",
    "psycopg[binary]==3.3.5",
    "prometheus-client==0.26.0",
    "uvicorn[standard]==0.52.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "backend*",
    "ingestion*",
    "orbital_engine*",
    "scripts*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
