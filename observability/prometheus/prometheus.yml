global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/orbitalai-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: orbitalai-api
    metrics_path: /metrics/
    static_configs:
      - targets:
          - api:8000

  - job_name: orbitalai-alertmanager
    static_configs:
      - targets:
          - alertmanager:9093

  - job_name: orbitalai-loki
    static_configs:
      - targets:
          - loki:3100

  - job_name: orbitalai-alloy
    static_configs:
      - targets:
          - alloy:12345
