name: orbitalai

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - orbitalai-postgres:/var/lib/postgresql
    networks:
      - data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  migrate:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    command:
      - python
      - -m
      - alembic
      - upgrade
      - head
    environment:
      ORBITAL_ENV: ${ORBITAL_ENV}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
    restart: "no"


  api:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      ORBITAL_ENV: ${ORBITAL_ENV}
      ORBITAL_LOG_LEVEL: ${ORBITAL_LOG_LEVEL}
      ORBITAL_METRICS_DIR: /app/data/observability
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ORBITAL_EPHEMERIS_WARNING_HOURS: ${ORBITAL_EPHEMERIS_WARNING_HOURS:-12}
      ORBITAL_EPHEMERIS_STALE_HOURS: ${ORBITAL_EPHEMERIS_STALE_HOURS:-24}
      ORBITAL_EPHEMERIS_MAX_HOURS: ${ORBITAL_EPHEMERIS_MAX_HOURS:-72}
      ORBITAL_SCREENING_MAX_OBJECTS: ${ORBITAL_SCREENING_MAX_OBJECTS:-40000}
      ORBITAL_SCREENING_MAX_PROPAGATIONS: ${ORBITAL_SCREENING_MAX_PROPAGATIONS:-12000000}
      ORBITAL_SCREENING_CHUNK_SECONDS: ${ORBITAL_SCREENING_CHUNK_SECONDS:-900}
      ORBITAL_SCREENING_MAX_CHUNK_UNIQUE_CANDIDATES: ${ORBITAL_SCREENING_MAX_CHUNK_UNIQUE_CANDIDATES:-4000000}
      SPACE_TRACK_IDENTITY: ${SPACE_TRACK_IDENTITY:-}
      SPACE_TRACK_PASSWORD: ${SPACE_TRACK_PASSWORD:-}
    volumes:
      - ../../data:/app/data

    depends_on:
       migrate:
         condition: service_completed_successfully
    ports:
      - "127.0.0.1:8008:8000"
    networks:
      - app
      - data
      - observability
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  app:
    name: orbitalai-app
  data:
    name: orbitalai-data
    internal: true
  observability:
    name: orbitalai-observability

volumes:
  orbitalai-postgres:
    name: orbitalai-postgres
