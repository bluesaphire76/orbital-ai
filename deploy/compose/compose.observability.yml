services:
  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ../../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../observability/prometheus/rules:/etc/prometheus/rules:ro
      - orbitalai-prometheus:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - observability

  alertmanager:
    image: prom/alertmanager:v0.34.0
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=
    volumes:
      - ../../observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - orbitalai-alertmanager:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - observability

  loki:
    image: grafana/loki:3.7.6
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki.yml
    volumes:
      - ../../observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - orbitalai-loki:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - observability

  alloy:
    image: grafana/alloy:v1.19.2
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ../../observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - orbitalai-alloy:/var/lib/alloy/data
    ports:
      - "127.0.0.1:12345:12345"
    networks:
      - observability
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:13.2.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - orbitalai-grafana:/var/lib/grafana
      - ../../observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - observability
    depends_on:
      - prometheus
      - loki

networks:
  observability:
    name: orbitalai-observability

volumes:
  orbitalai-prometheus:
    name: orbitalai-prometheus

  orbitalai-grafana:
    name: orbitalai-grafana

  orbitalai-alertmanager:
    name: orbitalai-alertmanager

  orbitalai-loki:
    name: orbitalai-loki

  orbitalai-alloy:
    name: orbitalai-alloy
