# Assert firing ALERTS samples and labels, independently of annotation wording.
rule_files:
- ../../observability/prometheus/rules/orbitalai-alerts.yml
evaluation_interval: 1m
tests:
- name: healthy platform and recent provider syncs
  interval: 1m
  input_series:
  - series: up{instance="api:8000",job="orbitalai-api"}
    values: 1x30
  - series: orbitalai_conjunction_metrics_available{instance="api:8000",job="orbitalai-api"}
    values: 1x30
  - series: orbitalai_operations_metrics_available{instance="api:8000",job="orbitalai-api"}
    values: 1x30
  - series: orbitalai_catalog_metrics_available{instance="api:8000",job="orbitalai-api"}
    values: 1x30
  - series: orbitalai_database_ready{instance="api:8000",job="orbitalai-api"}
    values: 1x30
  - series: orbitalai_database_last_check_timestamp_seconds{instance="api:8000",job="orbitalai-api"}
    values: 0+60x30
  - series: orbitalai_conjunction_last_run_propagation_failures{instance="api:8000",job="orbitalai-api"}
    values: '0x30'
  - series: orbitalai_conjunction_last_run_refinement_failures{instance="api:8000",job="orbitalai-api"}
    values: '0x30'
  - series: orbitalai_screening_eligible_objects{instance="api:8000",job="orbitalai-api"}
    values: 90x30
  - series: orbitalai_earth_orbit_objects{instance="api:8000",job="orbitalai-api"}
    values: 100x30
  - series: orbitalai_conjunction_failures_total{instance="api:8000",job="orbitalai-api",source="canonical"}
    values: '0x30'
  - series: orbitalai_ingestion_failures_total{instance="api:8000",job="orbitalai-api",provider="space-track"}
    values: '0x30'
  - series: orbitalai_ingestion_failures_total{instance="api:8000",job="orbitalai-api",provider="celestrak"}
    values: '0x30'
  - series: orbitalai_ingestion_failures_total{instance="api:8000",job="orbitalai-api",provider="satcat"}
    values: '0x30'
  - series: orbitalai_ingestion_last_success_timestamp_seconds{instance="api:8000",job="orbitalai-api",provider="space-track"}
    values: 60x30
  - series: orbitalai_ingestion_last_success_timestamp_seconds{instance="api:8000",job="orbitalai-api",provider="celestrak"}
    values: 60x30
  - series: orbitalai_ingestion_last_success_timestamp_seconds{instance="api:8000",job="orbitalai-api",provider="satcat"}
    values: 60x30
  promql_expr_test:
  - expr: ALERTS{alertstate="firing"}
    eval_time: 20m
    exp_samples: []
- name: API hold interval and recovery
  interval: 1m
  input_series:
  - series: up{instance="api:8000",job="orbitalai-api"}
    values: 0x2 1x2
  promql_expr_test:
  - expr: ALERTS{alertname="OrbitalAIApiDown",alertstate="firing"}
    eval_time: 1m
    exp_samples: []
  - expr: ALERTS{alertname="OrbitalAIApiDown",alertstate="firing"}
    eval_time: 2m
    exp_samples:
    - labels: ALERTS{alertname="OrbitalAIApiDown",alertstate="firing",component="api",instance="api:8000",job="orbitalai-api",severity="critical"}
      value: 1
  - expr: ALERTS{alertname="OrbitalAIApiDown",alertstate="firing"}
    eval_time: 3m
    exp_samples: []
- name: PostgreSQL hold interval and recovery
  interval: 1m
  input_series:
  - series: up{instance="api:8000",job="orbitalai-api"}
    values: 1x6
  - series: orbitalai_conjunction_metrics_available{instance="api:8000",job="orbitalai-api"}
    values: 1x6
  - series: orbitalai_operations_metrics_available{instance="api:8000",job="orbitalai-api"}
    values: 1x6
  - series: orbitalai_catalog_metrics_available{instance="api:8000",job="orbitalai-api"}
    values: 1x6
  - series: orbitalai_database_ready{instance="api:8000",job="orbitalai-api"}
    values: 0x2 1x3
  - series: orbitalai_database_last_check_timestamp_seconds{instance="api:8000",job="orbitalai-api"}
    values: 0+60x6
  promql_expr_test:
  - expr: ALERTS{alertname="OrbitalAIPostgresNotReady",alertstate="firing"}
    eval_time: 1m
    exp_samples: []
  - expr: ALERTS{alertname="OrbitalAIPostgresNotReady",alertstate="firing"}
    eval_time: 2m
    exp_samples:
    - labels: ALERTS{alertname="OrbitalAIPostgresNotReady",alertstate="firing",component="postgres",instance="api:8000",job="orbitalai-api",severity="critical"}
      value: 1
  - expr: ALERTS{alertname="OrbitalAIPostgresNotReady",alertstate="firing"}
    eval_time: 3m
    exp_samples: []
- name: old PostgreSQL probe does not report a current outage
  interval: 1m
  input_series:
  - series: up{instance="api:8000",job="orbitalai-api"}
    values: 1x10
  - series: orbitalai_conjunction_metrics_available{instance="api:8000",job="orbitalai-api"}
    values: 1x10
  - series: orbitalai_operations_metrics_available{instance="api:8000",job="orbitalai-api"}
    values: 1x10
  - series: orbitalai_catalog_metrics_available{instance="api:8000",job="orbitalai-api"}
    values: 1x10
  - series: orbitalai_database_ready{instance="api:8000",job="orbitalai-api"}
    values: '0x10'
  - series: orbitalai_database_last_check_timestamp_seconds{instance="api:8000",job="orbitalai-api"}
    values: '0x10'
  promql_expr_test:
  - expr: ALERTS{alertname="OrbitalAIPostgresNotReady",alertstate="firing"}
    eval_time: 5m
    exp_samples: []
- name: API outage suppresses duplicate PostgreSQL alert
  interval: 1m
  input_series:
  - series: up{instance="api:8000",job="orbitalai-api"}
    values: '0x6'
  - series: orbitalai_conjunction_metrics_available{instance="api:8000",job="orbitalai-api"}
    values: 1x6
  - series: orbitalai_operations_metrics_available{instance="api:8000",job="orbitalai-api"}
    values: 1x6
  - series: orbitalai_catalog_metrics_available{instance="api:8000",job="orbitalai-api"}
    values: 1x6
  - series: orbitalai_database_ready{instance="api:8000",job="orbitalai-api"}
    values: '0x6'
  - series: orbitalai_database_last_check_timestamp_seconds{instance="api:8000",job="orbitalai-api"}
    values: 0+60x6
  promql_expr_test:
  - expr: ALERTS{alertname="OrbitalAIPostgresNotReady",alertstate="firing"}
    eval_time: 3m
    exp_samples: []
  - expr: ALERTS{alertname="OrbitalAIApiDown",alertstate="firing"}
    eval_time: 3m
    exp_samples:
    - labels: ALERTS{alertname="OrbitalAIApiDown",alertstate="firing",component="api",instance="api:8000",job="orbitalai-api",severity="critical"}
      value: 1
- name: space-track exact threshold, five-minute hold and stale condition
